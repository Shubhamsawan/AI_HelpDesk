spring:
  application:
    name: help-desk-backened

  datasource:
    url: jdbc:mysql://localhost:3306/helpdesk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  ai:
    chat:
      memory:
        repository:
          type: jdbc
          initialize-schema: always

# Your custom Gemini API settings (must be at root level, not nested under spring)  
